name: daily-hub-laravel

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    ports:
      - "8002:80"
    depends_on:
      db:
        condition: service_healthy

  # WebSocket server: browsers connect here for live updates.
  reverb:
    build: .
    env_file: .env
    entrypoint: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    restart: unless-stopped
    ports:
      - "8082:8080"

  # Checks the radio stations every 15 seconds and broadcasts song changes through Reverb.
  listener:
    build: .
    env_file: .env
    entrypoint: ["php", "artisan", "radio:listen"]
    restart: unless-stopped
    depends_on:
      - reverb

volumes:
  pgdata:
